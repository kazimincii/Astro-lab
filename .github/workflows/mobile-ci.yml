name: Mobile CI

on:
  push:
    branches: [ main, develop, claude/** ]
    paths:
      - 'astrology-app/mobile/**'
      - '.github/workflows/mobile-ci.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'astrology-app/mobile/**'

jobs:
  test:
    name: Test & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: astrology-app/mobile/package-lock.json

      - name: Install dependencies
        working-directory: astrology-app/mobile
        run: npm ci

      - name: Run linter
        working-directory: astrology-app/mobile
        run: npm run lint || echo "Lint script not found, skipping..."

      - name: Check TypeScript compilation
        working-directory: astrology-app/mobile
        run: npx tsc --noEmit

      - name: Run tests
        working-directory: astrology-app/mobile
        run: npm test -- --coverage --watchAll=false

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: ./astrology-app/mobile/coverage/lcov.info
          flags: mobile
          name: mobile-coverage

  build-expo:
    name: Build Expo App (Web)
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: astrology-app/mobile/package-lock.json

      - name: Setup Expo
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        working-directory: astrology-app/mobile
        run: npm ci

      - name: Build web version
        working-directory: astrology-app/mobile
        run: npx expo export --platform web

  type-check:
    name: TypeScript Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: astrology-app/mobile/package-lock.json

      - name: Install dependencies
        working-directory: astrology-app/mobile
        run: npm ci

      - name: Run TypeScript compiler
        working-directory: astrology-app/mobile
        run: npx tsc --noEmit --pretty
