name: Backend CI

on:
  push:
    branches: [ main, develop, claude/** ]
    paths:
      - 'astrology-app/backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'astrology-app/backend/**'

jobs:
  test:
    name: Test & Lint
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: astrology_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: astrology-app/backend/package-lock.json

      - name: Install dependencies
        working-directory: astrology-app/backend
        run: npm ci

      - name: Run linter
        working-directory: astrology-app/backend
        run: npm run lint

      - name: Check TypeScript compilation
        working-directory: astrology-app/backend
        run: npm run build

      - name: Run unit tests
        working-directory: astrology-app/backend
        env:
          NODE_ENV: test
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USERNAME: postgres
          DB_PASSWORD: postgres
          DB_DATABASE: astrology_test
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          JWT_SECRET: test-jwt-secret-key-for-ci-min-32-chars
          JWT_REFRESH_SECRET: test-refresh-secret-key-for-ci
        run: npm test

      - name: Run E2E tests
        working-directory: astrology-app/backend
        env:
          NODE_ENV: test
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USERNAME: postgres
          DB_PASSWORD: postgres
          DB_DATABASE: astrology_test
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          JWT_SECRET: test-jwt-secret-key-for-ci-min-32-chars
          JWT_REFRESH_SECRET: test-refresh-secret-key-for-ci
        run: npm run test:e2e

      - name: Generate coverage report
        working-directory: astrology-app/backend
        env:
          NODE_ENV: test
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USERNAME: postgres
          DB_PASSWORD: postgres
          DB_DATABASE: astrology_test
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          JWT_SECRET: test-jwt-secret-key-for-ci-min-32-chars
          JWT_REFRESH_SECRET: test-refresh-secret-key-for-ci
        run: npm run test:cov

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: ./astrology-app/backend/coverage/lcov.info
          flags: backend
          name: backend-coverage

  build-docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        working-directory: astrology-app/backend
        run: docker build --tag astrology-backend:latest .

      - name: Test Docker image
        run: docker run --rm astrology-backend:latest node --version

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Run npm audit
        working-directory: astrology-app/backend
        run: npm audit --production --audit-level=moderate || true
